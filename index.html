<meta charset="utf-8" />
<title>Pina Earth · Outreach Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --border: #e5e7eb;
  --muted: #6b7280;
  --forest: #022b19;
  --accent: #25d956;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  background: var(--bg);
  font-family: Figtree, ui-sans-serif, system-ui, sans-serif;
  padding: 24px;
}
.logo { display: flex; align-items: center; }
.logo svg { height: 30px; width: auto; display: block; }

.picker { display: flex; flex-direction: column; align-items: center; gap: 24px; }
h1 {
  font-family: Sora, ui-sans-serif, system-ui, sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--forest);
  text-wrap: balance;
}
.sub { font-size: 14px; color: var(--muted); text-align: center; text-wrap: pretty; }

.versions {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

.version-card {
  --radius: 16px;
  width: 260px;
  padding: 22px 24px;
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: 0 1px 2px rgba(2, 43, 25, 0.06), 0 4px 16px rgba(2, 43, 25, 0.06);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.12s cubic-bezier(0.2, 0, 0, 1);
}
.version-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 2px 4px rgba(2, 43, 25, 0.08), 0 8px 24px rgba(2, 43, 25, 0.1);
}
.version-card:active { transform: translateY(-2px) scale(0.96); }

.version-tag {
  font-family: Sora, ui-sans-serif, system-ui, sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 3px 9px;
  border-radius: 7px;
  width: fit-content;
}
.version-card.current .version-tag { background: var(--accent); color: var(--forest); }
.version-card.archived .version-tag { background: var(--border); color: var(--muted); }

.version-title { font-family: Sora, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; color: var(--forest); }
.version-desc { font-size: 13px; color: var(--muted); line-height: 1.5; text-wrap: pretty; }
</style>
</head>
